<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VPN Live Dev — Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="miniapp-container">
    
    <!-- Header -->
    <header class="user-header">
      <div class="user-info">
        <div class="avatar" id="user-avatar">VPN</div>
        <div>
          <div style="font-weight: 700; font-size: 1rem;" id="user-name">Загрузка...</div>
          <div style="font-size: 0.75rem; color: var(--text-dim);" id="user-id">ID: ...</div>
        </div>
      </div>
      <div style="text-align: right;">
        <div style="font-size: 1.15rem; font-weight: 800; color: var(--accent-emerald);" id="user-balance">0 ₽</div>
        <div style="font-size: 0.75rem; color: var(--text-muted);" id="user-days">...</div>
      </div>
    </header>

    <!-- Hero Power Button -->
    <section class="power-section">
      <div style="margin-bottom: 1rem; background: rgba(255,255,255,0.05); padding: 0.4rem 0.85rem; border-radius: 999px; font-size: 0.8rem; border: 1px solid var(--border-subtle);">
        🇳🇱 <span id="server-name">Нидерланды (Амстердам)</span> • <span id="server-ping">45 ms</span>
      </div>

      <div class="power-circle" id="power-btn">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
          <line x1="12" y1="2" x2="12" y2="12"/>
        </svg>
        <span style="font-size: 0.7rem; font-weight: 700; margin-top: 6px; text-transform: uppercase;">INCY Connect</span>
      </div>
    </section>

    <!-- 1-Click Connect Button -->
    <a href="#" id="btn-incy" class="btn btn-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      <span>Подключить в INCY</span>
    </a>

    <!-- Action Buttons -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
      <button class="btn btn-secondary" id="btn-copy-vless">
        📋 Ключ VLESS
      </button>
      <button class="btn btn-secondary" id="btn-copy-sub">
        🔗 Подписка
      </button>
    </div>

    <!-- Whitelist toggle -->
    <div class="card switch-box">
      <div>
        <div style="font-weight: 600; font-size: 0.95rem;">Белый список РФ</div>
        <div style="font-size: 0.75rem; color: var(--text-dim);">Банки и Госуслуги напрямую</div>
      </div>
      <div class="switch active" id="whitelist-switch"></div>
    </div>

    <!-- Referral block -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
        <span style="font-weight: 600; font-size: 0.9rem;">Приглашай друзей</span>
        <span style="font-size: 0.75rem; color: #fbbf24; font-weight: 700;">+10 ₽ бонус</span>
      </div>
      <button class="btn btn-secondary" id="btn-share-ref" style="font-size: 0.85rem;">
        📤 Поделиться реферальной ссылкой
      </button>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
