{% extends 'base.html' %}
{% block title %}Письмо отправлено — VPN Live Dev{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card" style="text-align: center; padding: 3rem 2rem;">
    <!-- Glowing Animated Mail Icon -->
    <div style="width: 72px; height: 72px; margin: 0 auto 1.5rem; background: rgba(16, 185, 129, 0.12); border: 2px solid rgba(16, 185, 129, 0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px var(--accent-emerald-glow);">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
    </div>

    <h2 style="font-size: 1.35rem; font-weight: 700; line-height: 1.4; margin-bottom: 1.25rem; color: var(--text-main);">
      Вам на почту поступило письмо с ссылкой для подтверждения пароля.
    </h2>
    
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.5;">
      Перейдите по ссылке в письме, чтобы завершить восстановление и установить новый пароль.
    </p>

    <a href="{% url 'login' %}" class="btn btn-secondary btn-block">
      <span>В начало</span>
    </a>
  </div>
</div>
{% endblock %}
