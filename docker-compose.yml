version: '3.8'

services:
  # ----------------------------------------------------
  # 1. DATABASE (PostgreSQL)
  # ----------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: vpn_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-vpn_db}
      POSTGRES_USER: ${DB_USER:-vpn_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vpn_secure_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vpn_user} -d ${DB_NAME:-vpn_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpn_network

  # ----------------------------------------------------
  # 2. CACHE & QUEUE (Redis)
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vpn_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpn_network

  # ----------------------------------------------------
  # 3. WEB SITE & BACKEND (Django + Async + Admin)
  # ----------------------------------------------------
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vpn_web
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn core.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 3"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-generate-a-strong-secret-key-for-production}
      - DOMAIN=${DOMAIN:-vpn.live-dev.by}
      - SITE_URL=${SITE_URL:-http://vpn.live-dev.by}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-vpn.live-dev.by,localhost,127.0.0.1,web}
      - DB_NAME=${DB_NAME:-vpn_db}
      - DB_USER=${DB_USER:-vpn_user}
      - DB_PASSWORD=${DB_PASSWORD:-vpn_secure_password_123}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_USERNAME=${BOT_USERNAME}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.yandex.ru}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-"VPN Live Dev" <support@live-dev.by>}
      - XRAY_HOST=${XRAY_HOST}
      - XRAY_USER=${XRAY_USER}
      - XRAY_PASSWORD=${XRAY_PASSWORD}
      - XRAY_PUBLIC_IP=${XRAY_PUBLIC_IP}
      - XRAY_PUBLIC_PORT=${XRAY_PUBLIC_PORT:-443}
      - XRAY_SNI=${XRAY_SNI:-www.microsoft.com}
      - XRAY_PBK=${XRAY_PBK}
      - XRAY_SHORT_ID=${XRAY_SHORT_ID}
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vpn_network

  # ----------------------------------------------------
  # 4. TELEGRAM MINI APP (Independent Container)
  # ----------------------------------------------------
  miniapp:
    build:
      context: ./miniapp
      dockerfile: Dockerfile
    container_name: vpn_miniapp
    restart: always
    volumes:
      - ./miniapp:/usr/share/nginx/html:ro
    networks:
      - vpn_network

  # ----------------------------------------------------
  # 5. TELEGRAM BOT (aiogram 3.x - Independent Container)
  # ----------------------------------------------------
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: vpn_bot
    restart: always
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_USERNAME=${BOT_USERNAME}
      - WEB_API_URL=http://web:8000/api
      - TELEGRAM_WEBAPP_URL=${TELEGRAM_WEBAPP_URL:-http://vpn.live-dev.by/miniapp/}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SITE_URL=${SITE_URL:-http://vpn.live-dev.by}
    volumes:
      - ./bot:/app
    depends_on:
      - web
      - redis
    networks:
      - vpn_network

  # ----------------------------------------------------
  # 6. REVERSE PROXY & GATEWAY (Nginx)
  # ----------------------------------------------------
  gateway:
    image: nginx:alpine
    container_name: vpn_gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_challenges:/var/www/certbot
    depends_on:
      - web
      - miniapp
    networks:
      - vpn_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  certbot_certs:
  certbot_challenges:

networks:
  vpn_network:
    driver: bridge
